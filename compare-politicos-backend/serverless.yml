service: compare-politicos-api

frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    DATABASE_URL: ${env:DATABASE_URL} # Puxa do seu arquivo .env local ou CI
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: !GetAtt SyncDespesasQueue.Arn

functions:
  # -----------------------------------------------------
  # 1. API PUBLICA (Consumida pelo Frontend Next.js)
  # -----------------------------------------------------
  api:
    handler: src/api/app.handler
    description: "Servidor Koa.js para rotas da API"
    events:
      - httpApi:
          path: /
          method: 'GET'
      - httpApi:
          path: /api
          method: 'GET'
      - httpApi:
          path: /api/{proxy+}
          method: '*'

  # -----------------------------------------------------
  # 2. WORKERS / ETL (Rotinas de Background)
  # -----------------------------------------------------
  syncDfDeputados:
    handler: src/workers/sync-df-deputados.handler
    description: "Sincroniza a tabela df_deputados com a API da Camara"
    timeout: 60 # Aumentamos para 60s pois requisições externas podem oscilar
    events:
      # O EventBridge aciona esta função automaticamente
      # Roda toda madrugada de domingo às 03:00 (06:00 UTC)
      - schedule: cron(0 6 ? * 1 *)
  
  syncDfPartidos:
    handler: src/workers/sync-df-partidos.handler
    description: "Sincroniza a tabela df_partidos com a API da Camara"
    timeout: 30
    events:
      # Roda aos domingos às 02:00 (antes dos deputados)
      - schedule: cron(0 5 ? * 1 *)

  syncDespesasOrquestrador:
    handler: src/workers/sync-despesas-orquestrador.handler
    timeout: 60
    environment:
      # Passa a URL da fila para o código do Node
      FILA_DESPESAS_URL: !Ref SyncDespesasQueue
    events:
      # Roda toda madruga de domingo, por exemplo
      - schedule: cron(0 4 ? * 1 *) 

  syncDespesasWorker:
    handler: src/workers/sync-despesas-worker.handler
    timeout: 300 # 5 minutos para dar tempo de baixar todas as despesas de 1 deputado
    events:
      - sqs:
          arn: !GetAtt SyncDespesasQueue.Arn
          batchSize: 1 # Pega 1 deputado por vez da fila
          maximumConcurrency: 5

resources:
  Resources:
    SyncDespesasQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sync-despesas-queue
        VisibilityTimeout: 300 # Deve ser igual ou maior que o timeout do Worker