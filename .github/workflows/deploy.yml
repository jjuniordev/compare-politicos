name: Deploy Compare Políticos

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy API (Serverless/Koa)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências e Deploy
        working-directory: ./compare-politicos-backend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          npm ci
          npx serverless@3 deploy

  deploy-frontend:
    name: Deploy Web (Next.js/S3)
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Next.js
        working-directory: ./compare-politicos-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Sincronizar com S3 e Invalidar Cache CloudFront
        working-directory: ./compare-politicos-frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1' # Altere se seu S3/CloudFront estiver em outra região
        run: |
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"